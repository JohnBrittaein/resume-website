# Builds the site and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
# See docs/DEPLOY.md.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Served from the custom domain (set in repo Settings → Pages), so the site
      # lives at the domain root. Without a custom domain it would instead be
      # SITE_URL: https://johnbrittaein.github.io and BASE_PATH: /<repo>/
      SITE_URL: https://johnbrittain.com
      BASE_PATH: /
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache processed images
        uses: actions/cache@v4
        with:
          path: .cache/images
          key: images-${{ hashFiles('content/**', 'public/images/**') }}
          restore-keys: images-
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
